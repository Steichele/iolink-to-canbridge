
    <center>
        <table align="center" width = "700px" high = "200px">
            <tr>
                <td high = "200px">
                    <h2>Trace:</h2>
                    {% for log in cs.log_message %}
                        {{ log }}<br>
                    {% endfor %}
                </td>
            </tr>
        </table>
    
        <table align="center" width = "700px">
            <tr> 
                <td>
                    <h2>Sensorwerte:</h2>

                    {% for key, value in cs.decodedvalue.items() %}

                    <tr>
                        <td>
                            <li><strong>{{ key }}:</strong><strong> {{ value }}</strong></li>
                        </td>
                        <td>
                            {{cs.comments[key]}} 
                        </td>
                    </tr>
                        {% endfor %}                       
                </td>
            </tr>
                
    </center>
